spring:
  application:
    name: procurax-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/procurax}
    username: ${DATABASE_USERNAME:procurax}
    password: ${DATABASE_PASSWORD:procurax-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${REALTIME_CONSUMER_GROUP:procurax-realtime-sse-${HOSTNAME:local}}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: procurax:session
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}

procurax:
  security:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    rate-limit:
      auth:
        limit: ${AUTH_RATE_LIMIT:20}
        window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  vendor-scoring:
    weights:
      price: 0.30
      delivery: 0.20
      quality: 0.20
      compliance: 0.15
      performance: 0.10
      payment-terms: 0.05
  storage:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:15}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:5}
  realtime:
    enabled: ${REALTIME_SSE_ENABLED:true}
    topic-pattern: '${REALTIME_TOPIC_PATTERN:^procurax\..+\.v1$}'
    max-clients: ${REALTIME_MAX_CLIENTS:5000}
    max-clients-per-organization: ${REALTIME_MAX_CLIENTS_PER_ORG:500}
    queue-capacity-per-client: ${REALTIME_QUEUE_CAPACITY:128}
    heartbeat-seconds: ${REALTIME_HEARTBEAT_SECONDS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
