spring:
  application:
    name: procurax-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/procurax}
    username: ${DATABASE_USERNAME:procurax}
    password: ${DATABASE_PASSWORD:procurax-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: procurax:session
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
        http-only: true

procurax:
  security:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit:
      auth:
        limit: ${AUTH_RATE_LIMIT:20}
        window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
