spring:
  kafka:
    listener:
      auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  session:
    store-type: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

procurax:
  outbox:
    enabled: false
  realtime:
    enabled: false
  security:
    frontend-url: http://localhost:5173
    allowed-origins: http://localhost:5173
    rate-limit:
      auth:
        limit: 20
        window-seconds: 60
